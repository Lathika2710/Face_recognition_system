<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceAI — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-shell">

  <div class="login-left">
    <div class="login-left-content">
      <div class="login-eyebrow">◉ FaceAI Platform</div>
      <h1 class="login-title">AI FACE<br>RECOGNITION<br>SYSTEM</h1>

      <div class="login-sub-rotator">
        <span>Smart Recognition</span>
        <span>Secure Access</span>
        <span>Real-Time Intelligence</span>
      </div>

      <svg class="face-net" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
        <g id="netLines">
          <line class="edge" x1="60" y1="60" x2="150" y2="40"/>
          <line class="edge" x1="150" y1="40" x2="240" y2="55"/>
          <line class="edge" x1="240" y1="55" x2="320" y2="90"/>
          <line class="edge" x1="60" y1="60" x2="90" y2="140"/>
          <line class="edge" x1="150" y1="40" x2="140" y2="130"/>
          <line class="edge" x1="240" y1="55" x2="230" y2="150"/>
          <line class="edge" x1="90" y1="140" x2="140" y2="130"/>
          <line class="edge" x1="140" y1="130" x2="230" y2="150"/>
          <line class="edge" x1="230" y1="150" x2="320" y2="90"/>
          <line class="edge" x1="90" y1="140" x2="170" y2="190"/>
          <line class="edge" x1="170" y1="190" x2="230" y2="150"/>
          <line class="edge" x1="320" y1="90" x2="300" y2="170"/>
          <line class="edge" x1="170" y1="190" x2="300" y2="170"/>
        </g>
        <g id="netNodes">
          <circle class="node" cx="60" cy="60" r="3"/>
          <circle class="node" cx="150" cy="40" r="3"/>
          <circle class="node" cx="240" cy="55" r="3"/>
          <circle class="node" cx="320" cy="90" r="3"/>
          <circle class="node" cx="90" cy="140" r="3"/>
          <circle class="node" cx="140" cy="130" r="3"/>
          <circle class="node" cx="230" cy="150" r="3"/>
          <circle class="node" cx="170" cy="190" r="3"/>
          <circle class="node" cx="300" cy="170" r="3"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card glass">
      <h2>Welcome Back 👋</h2>
      <p class="sub">Sign in to access your AI security dashboard</p>

      <div class="login-error" id="loginError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="loginErrorText">Invalid username or password</span>
      </div>

      <form id="loginForm">
        <div class="field-group">
          <label for="username">Username</label>
          <div class="field-input-wrap" id="usernameWrap">
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
          </div>
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-input-wrap" id="passwordWrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
      </form>

      <div class="form-footer">
        <a href="{{ url_for('signup') }}" class="btn btn-outline btn-block">Create Account</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("togglePw").addEventListener("click", () => {
  const pw = document.getElementById("password");
  const eye = document.getElementById("eyeIcon");
  if (pw.type === "password") {
    pw.type = "text";
    eye.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.6 21.6 0 015.06-6.06M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 8 11 8a21.6 21.6 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>';
  } else {
    pw.type = "password";
    eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");
  const errorBox = document.getElementById("loginError");
  errorBox.classList.remove("show");

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.success) {
      btnText.textContent = "Success — redirecting...";
      window.location.href = data.redirect;
    } else {
      throw new Error(data.error || "Invalid credentials");
    }
  } catch (err) {
    document.getElementById("loginErrorText").textContent = err.message;
    errorBox.classList.add("show");
    document.getElementById("usernameWrap").classList.add("shake");
    document.getElementById("passwordWrap").classList.add("shake");
    setTimeout(() => {
      document.getElementById("usernameWrap").classList.remove("shake");
      document.getElementById("passwordWrap").classList.remove("shake");
    }, 400);
    btn.disabled = false;
    btnText.textContent = "Sign In";
  }
});
</script>
</body>
</html>
